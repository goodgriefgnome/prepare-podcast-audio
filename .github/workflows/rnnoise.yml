name: Build RNNoise

# Builds every RNNoise variant (for speed comparisons) and publishes them on
# the rnnoise-build branch. The app ships rnnoise-release.wasm, copied to
# src/vendor/rnnoise.wasm; the deploy workflow checks that copy matches.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [rnnoise/**, .github/workflows/rnnoise.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.8
      - run: rnnoise/build.sh out o2 o3 simd avx avx2 release
      - name: Same output on a second build
        run: rnnoise/build.sh again release && cmp out/rnnoise-release.wasm again/rnnoise-release.wasm
      - name: Publish to the rnnoise-build branch
        run: |
          cd out
          git init -q -b rnnoise-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "RNNoise build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" rnnoise-build
