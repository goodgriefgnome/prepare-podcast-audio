name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The app ships a prebuilt RNNoise (src/vendor/rnnoise.wasm); check it is
  # exactly what rnnoise/build.sh produces.
  rnnoise:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.8
      - run: rnnoise/build.sh out release
      - run: cmp out/rnnoise-release.wasm src/vendor/rnnoise.wasm

  build:
    needs: rnnoise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The restoration lab's Resemble Enhance models (restore.html), converted from the
      # published weights and cached until restore-models/ changes.
      - id: models
        uses: actions/cache@v4
        with:
          path: restore-models/out
          key: restore-models-${{ hashFiles('restore-models/**') }}
      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: steps.models.outputs.cache-hit != 'true'
        run: |
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.15.0 torchaudio==2.11.1
          pip install --quiet -r restore-models/requirements.txt
          restore-models/build.sh restore-models/out resemble
      - run: cp -r restore-models/out dist/models
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
